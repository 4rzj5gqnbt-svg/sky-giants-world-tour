<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Sky Giants World Tour</title>
<style>
:root{
  --bg:#8fd7f7; --bg2:#c9f0ff; --panel:#ffffff; --line:#f2a93b;
  --cyan:#0e7fb8; --pink:#e0417c; --gold:#e08a00; --green:#159a52;
  --text:#16324e; --text-dim:#5c7a97;
  --sun:#ffd23f; --sky1:#e6f8ff; --sky2:#bfe9ff; --land:#8ed98a; --land2:#5fbf6b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(180deg,#a8e4ff 0%,#ffe9b0 100%);
  color:var(--text);
  font-family:'VT323', 'Courier New', monospace;
  min-height:100vh;
  min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:18px;
}
@media (max-width:600px){
  body{ padding:8px; align-items:flex-start; }
}
h1,h2,h3,.pixel{ font-family:'Press Start 2P', monospace; }

.cabinet{
  width:100%; max-width:980px;
  background:linear-gradient(180deg,#ffcf5c,#ff9a5c 55%,#ff7ba8);
  border-radius:18px;
  padding:14px;
  box-shadow:0 0 0 3px #ffffff, 0 16px 40px rgba(20,60,90,0.28);
}
@media (max-width:600px){
  .cabinet{ padding:8px; border-radius:12px; }
}
.cabinet-label{
  display:flex; align-items:center; justify-content:space-between;
  padding:2px 10px 12px;
  font-family:'Press Start 2P', monospace;
  font-size:10px; letter-spacing:1px; color:#7a3d00;
}
.cabinet-label b{ color:#ffffff; text-shadow:0 1px 0 #c96a00; }

.screen{
  position:relative;
  background:radial-gradient(ellipse at 50% 0%, var(--sky1) 0%, var(--sky2) 100%);
  border-radius:10px;
  border:3px solid #ffffff;
  overflow:hidden;
  aspect-ratio:16/10;
  min-height:520px;
}
@media (max-width:600px){
  .screen{
    aspect-ratio:auto;
    min-height:0;
    height:calc(100dvh - 70px);
    max-height:760px;
  }
}
@media (max-width:600px) and (max-height:700px){
  .screen{ height:calc(100dvh - 50px); }
}
.scanlines{
  position:absolute; inset:0; pointer-events:none; z-index:50;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,0.22) 0px, rgba(255,255,255,0.22) 1px, transparent 2px, transparent 5px);
  opacity:.5;
}
.crt-vignette{
  position:absolute; inset:0; pointer-events:none; z-index:51;
  box-shadow: inset 0 0 70px 18px rgba(255,255,255,0.35);
}

.scene{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  padding:22px 26px;
  overflow-y:auto;
  overflow-x:hidden;
}
.scene.active{ display:flex; }
.scene::-webkit-scrollbar{ display:none; }
@media (max-width:600px){
  .scene{ padding:14px 14px; }
}

/* ---------- HUD ---------- */
.hud{
  display:flex; justify-content:space-between; align-items:center;
  font-family:'Press Start 2P', monospace; font-size:10px;
  color:var(--gold); margin-bottom:14px; flex-wrap:wrap; gap:8px;
}
.hud .chip{
  background:#ffffff; border:2px solid var(--line); border-radius:8px;
  padding:6px 10px; color:var(--cyan);
  box-shadow:0 2px 0 rgba(0,0,0,0.10);
}
.hud .chip.credits{ color:#b76b00; border-color:var(--sun); }
.hud .chip.trophy{ color:#c47b00; }
.hud .chip.sound{ cursor:pointer; color:var(--cyan); margin-left:auto; }
.hud .chip.lang{ cursor:pointer; color:var(--green); border-color:var(--green); }

/* ---------- LANGUAGE PICKER ---------- */
#scene-lang{ align-items:center; justify-content:center; text-align:center; gap:20px; }
.lang-title{ font-family:'Press Start 2P',monospace; font-size:16px; color:var(--cyan); line-height:1.8; }
.lang-sub{ font-size:18px; color:var(--text-dim); }
.lang-btns{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
.lang-btn{
  font-family:'Press Start 2P',monospace; font-size:14px;
  background:#fff; border:4px solid var(--green); color:var(--green);
  border-radius:14px; padding:22px 26px; cursor:pointer;
  box-shadow:0 6px 0 rgba(21,154,82,.35); min-width:190px;
}
.lang-btn .flag{ display:block; font-size:34px; margin-bottom:10px; }
.lang-btn.it{ border-color:var(--pink); color:var(--pink); box-shadow:0 6px 0 rgba(224,65,124,.3); }
.lang-btn:hover{ transform:translateY(-2px); }
.lang-btn:active{ transform:translateY(4px); box-shadow:none; }
@media (max-width:600px){
  .lang-title{ font-size:12px; }
  .lang-btn{ font-size:12px; padding:16px 18px; min-width:140px; }
}

/* ---------- TITLE ---------- */
#scene-title{ align-items:center; justify-content:center; text-align:center; gap:18px; }
.title-plane{ font-size:54px; animation:bob 2.2s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-14px) rotate(3deg);} }
.logo{ font-size:30px; line-height:1.5; color:var(--cyan); text-shadow:2px 3px 0 #ffffff, 4px 5px 0 rgba(14,127,184,.25); }
.logo .sub{ display:block; font-size:13px; color:var(--pink); margin-top:10px; text-shadow:1px 2px 0 #fff; }
.blink{ animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.press-start{ font-family:'Press Start 2P',monospace; font-size:13px; color:#fff; background:var(--green); cursor:pointer; margin-top:6px; padding:14px 20px; border:3px solid #0d6f3b; border-radius:10px; box-shadow:0 5px 0 #0d6f3b; }
.press-start:active{ transform:translateY(4px); box-shadow:none; }
.title-foot{ font-size:17px; color:var(--text); max-width:560px; }
.stars{ position:absolute; inset:0; z-index:0; pointer-events:none; }
.star{ position:absolute; width:5px; height:5px; border-radius:50%; background:#ffd23f; opacity:0.8; animation:twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity:0.2;} 50%{ opacity:0.95;} }
@media (max-width:600px){
  #scene-title{ gap:10px; }
  .title-plane{ font-size:38px; }
  .logo{ font-size:20px; }
  .logo .sub{ font-size:10px; margin-top:6px; }
  .title-foot{ font-size:14px; max-width:100%; }
  .press-start{ font-size:12px; }
}

/* ---------- BUTTONS ---------- */
.btn{
  font-family:'Press Start 2P', monospace; font-size:10px;
  background:var(--panel); color:var(--cyan); border:2px solid var(--cyan);
  border-radius:8px; padding:10px 14px; cursor:pointer;
  box-shadow:0 3px 0 rgba(14,127,184,.45); transition:transform .06s ease;
}
.btn:hover{ background:#eaf7ff; }
.btn:active{ transform:translateY(3px); box-shadow:none; }
.btn:disabled{ opacity:0.35; cursor:not-allowed; }
.btn.disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none !important; }
.btn.pink{ color:var(--pink); border-color:var(--pink); box-shadow:0 3px 0 rgba(224,65,124,.45); }
.btn.gold{ color:#b76b00; border-color:var(--sun); box-shadow:0 3px 0 rgba(224,138,0,.45); }
.btn.small{ font-size:8px; padding:7px 9px; }
.btn:focus-visible{ outline:3px solid var(--pink); outline-offset:2px; }

/* ---------- MAP ---------- */
#scene-map{ padding:14px 18px; }
.map-wrap{ position:relative; flex:1; border:3px solid var(--line); border-radius:10px; background:var(--sky2); overflow:hidden; }
.map-svg{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
.map-svg.grabbing{ cursor:grabbing; }
.airport-dot{ cursor:pointer; }
.airport-dot circle.core{ transition:r .15s ease; }
.airport-dot:active circle.core{ transform:scale(0.72); transform-box:fill-box; transform-origin:center; }
.airport-label{ font-family:'VT323',monospace; pointer-events:none; }
.map-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px; flex-wrap:wrap; }
.legend{ display:flex; gap:14px; font-size:15px; color:var(--text-dim); flex-wrap:wrap; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.zoom-ctrl{ position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px; z-index:5; }
.zoom-ctrl .btn{ padding:6px 10px; font-size:12px; line-height:1; }
.map-hint{ position:absolute; left:10px; bottom:8px; font-size:13px; color:var(--text); background:rgba(255,255,255,.8); padding:4px 8px; border-radius:6px; z-index:5; }
.route-banner{ position:absolute; left:10px; top:10px; color:#7a3d00; background:rgba(255,255,255,.92); border:2px solid var(--sun); padding:6px 10px; border-radius:8px; z-index:6; font-family:'Press Start 2P',monospace; font-size:9px; line-height:1.6; max-width:70%; display:none; }
.route-banner.show{ display:block; }

/* ---------- BOOKING CONFIRMATION ---------- */
.booking-overlay{
  position:absolute; inset:0; z-index:20; display:none;
  align-items:center; justify-content:center;
  background:rgba(15,40,60,0.45); padding:14px;
}
.booking-overlay.show{ display:flex; }
.booking-card{
  position:relative; width:100%; max-width:380px;
  background:#ffffff; border:3px solid var(--sun); border-radius:14px;
  padding:18px 18px 16px; box-shadow:0 10px 30px rgba(0,0,0,.3);
  animation:bookPop .18s ease;
}
@keyframes bookPop{ from{ transform:scale(0.9); opacity:0;} to{ transform:scale(1); opacity:1;} }
.booking-close{
  position:absolute; right:10px; top:8px; font-size:20px; line-height:1; color:var(--text-dim);
  cursor:pointer; padding:2px 6px; border-radius:6px;
}
.booking-close:hover{ background:#f0f0f0; color:var(--text); }
.booking-dest{ font-family:'Press Start 2P',monospace; font-size:14px; color:var(--cyan); padding-right:20px; }
.booking-sub{ font-size:16px; color:var(--text-dim); margin-top:4px; margin-bottom:12px; }
.booking-label{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
.booking-planes{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.plane-opt{
  display:flex; align-items:center; gap:10px; text-align:left;
  font-family:'VT323',monospace; font-size:16px; background:#f7fbfd;
  border:2px solid #bcd6e6; border-radius:10px; padding:8px 10px; cursor:pointer; color:var(--text);
}
.plane-opt .pe{ font-size:22px; }
.plane-opt .pn{ flex:1; }
.plane-opt .pt{ font-size:12px; color:var(--text-dim); }
.plane-opt .pc{ font-family:'Press Start 2P',monospace; font-size:11px; color:#b76b00; white-space:nowrap; }
.plane-opt.sel{ border-color:var(--green); background:#e7f8ec; }
.plane-opt.sel .pc{ color:#1a7a3d; }
.booking-cost-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:17px; padding:8px 10px; background:#fff8e2; border:1px solid var(--sun); border-radius:8px; margin-bottom:12px;
}
.booking-cost{ font-family:'Press Start 2P',monospace; font-size:13px; color:#b76b00; }
.booking-actions{ display:flex; gap:10px; }
.booking-actions .btn{ flex:1; text-align:center; }
.booking-warn{ margin-top:8px; font-size:13px; color:var(--pink); text-align:center; min-height:16px; }

/* ---------- FLIGHT (dedicated full-screen animation) ---------- */
#scene-flight{ padding:0; }
.flight-sky{
  position:relative; flex:1; overflow:hidden; border-radius:0;
  background:linear-gradient(180deg, #2f6fb0 0%, #6fb8e6 45%, #bfe4ff 78%, #dff3ff 100%);
  transition:background 1.2s ease;
}
.flight-sky.night{
  background:linear-gradient(180deg, #0e0a2e 0%, #2a1e5c 30%, #7a4a8a 55%, #d97a4a 82%, #f2b06a 100%);
}
.flight-sun{
  position:absolute; top:8%; right:12%; width:70px; height:70px; border-radius:50%;
  background:radial-gradient(circle, #fff6c8 0%, #ffe27a 55%, rgba(255,226,122,0) 72%);
  box-shadow:0 0 40px 12px rgba(255,226,122,.5);
  transition:opacity .8s ease;
}
.flight-sky.night .flight-sun{ opacity:0; }
.flight-moon{
  position:absolute; top:8%; right:12%; width:60px; height:60px; border-radius:50%;
  background:radial-gradient(circle at 38% 35%, #fffdf2, #f2dca0 70%);
  box-shadow:0 0 30px 8px rgba(255,240,200,.4);
  opacity:0; transition:opacity .8s ease; pointer-events:none;
}
.flight-moon::after{ content:""; position:absolute; top:13px; left:9px; width:13px; height:13px; border-radius:50%; background:rgba(180,160,120,.35); }
.flight-moon::before{ content:""; position:absolute; top:33px; left:31px; width:8px; height:8px; border-radius:50%; background:rgba(180,160,120,.3); }
.flight-sky.night .flight-moon{ opacity:1; }
.flight-stars{ position:absolute; inset:0; opacity:0; transition:opacity 1s ease; pointer-events:none; }
.flight-sky.night .flight-stars{ opacity:1; }
.flight-star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; }
.flight-star.big{ width:3px; height:3px; box-shadow:0 0 4px 1px rgba(255,255,255,.8); }
.flight-minimap{
  position:absolute; left:10px; top:10px; width:130px; height:64px;
  background:rgba(10,8,20,.55); border:2px solid rgba(255,217,102,.9); border-radius:9px;
  padding:6px 8px; z-index:6; backdrop-filter:blur(1px);
}
.flight-minimap .mtitle{ font-family:'Press Start 2P',monospace; font-size:6px; color:#ffd966; opacity:.85; margin-bottom:4px; }
.flight-minidot{ position:absolute; width:6px; height:6px; border-radius:50%; background:#ffd966; box-shadow:0 0 4px 1px rgba(255,217,102,.7); }
.flight-minidot.here{ background:#7fe0c9; box-shadow:0 0 5px 2px rgba(127,224,201,.8); }
.flight-miniroute{ position:absolute; border-top:2px dashed rgba(255,255,255,.5); }
.flight-hud{
  position:absolute; right:10px; top:10px; z-index:6;
  background:rgba(10,8,20,.55); border:2px solid rgba(127,224,201,.9); border-radius:9px;
  padding:7px 10px; font-family:'VT323',monospace; font-size:13px; color:#dff7f0; text-align:right; line-height:1.5;
}
.flight-hud b{ color:#7fe0c9; }
.flight-clouds{ position:absolute; inset:0; background-repeat:repeat-x; background-size:340px 140px; }
#flight-clouds-far{
  opacity:.55; background-position:0 18%;
  background-image:
    radial-gradient(ellipse 46px 20px at 40px 40px, #ffffff 60%, transparent 62%),
    radial-gradient(ellipse 60px 26px at 160px 70px, #ffffff 60%, transparent 62%),
    radial-gradient(ellipse 40px 18px at 280px 30px, #ffffff 60%, transparent 62%);
  animation: cloudDrift 22s linear infinite;
}
#flight-clouds-near{
  opacity:.85; background-position:0 62%;
  background-image:
    radial-gradient(ellipse 60px 26px at 80px 60px, #ffffff 65%, transparent 67%),
    radial-gradient(ellipse 44px 20px at 220px 90px, #ffffff 65%, transparent 67%),
    radial-gradient(ellipse 70px 30px at 320px 40px, #ffffff 65%, transparent 67%);
  animation: cloudDrift 11s linear infinite;
}
@keyframes cloudDrift{ from{ background-position-x:0; } to{ background-position-x:-340px; } }
.flight-path{ position:absolute; left:0; right:0; top:6%; height:76%; }
.flight-path-svg{ position:absolute; inset:0; width:100%; height:100%; }
.flight-plane{
  position:absolute; left:4%; top:88%;
  font-size:38px; line-height:1;
  transform:translate(-50%,-50%) rotate(0deg);
  filter:drop-shadow(0 6px 10px rgba(10,40,70,.35));
  will-change:left, top, transform;
  transition:filter .3s ease;
}
.flight-shadow{
  position:absolute; left:4%; top:96%; width:26px; height:8px;
  background:rgba(10,40,70,.28); border-radius:50%;
  transform:translate(-50%,-50%); filter:blur(1.5px);
  will-change:left, top, width, opacity;
}
.flight-contrail{
  position:absolute; width:10px; height:10px; border-radius:50%;
  background:rgba(255,255,255,.85); pointer-events:none;
  transform:translate(-50%,-50%);
  animation:contrailFade .9s ease-out forwards;
}
@keyframes contrailFade{
  from{ opacity:.55; transform:translate(-50%,-50%) scale(0.6); }
  to{ opacity:0; transform:translate(-50%,-50%) scale(2.6); }
}
.flight-ground{
  position:absolute; left:0; right:0; bottom:0; height:22%;
  background:linear-gradient(180deg, #9fd88a 0%, #7ec46b 45%, #5fae57 100%);
  border-top:3px solid rgba(255,255,255,.5);
}
.flight-ground{ --scroll:0px; }
.flight-ground::before{
  content:""; position:absolute; left:-80px; right:-80px; top:0; height:100%;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 26px, transparent 26px 60px);
  opacity:.5; will-change:transform; transform:translateX(var(--scroll,0px));
}
.flight-city{
  position:absolute; bottom:24%; font-family:'Press Start 2P',monospace; font-size:10px;
  color:#0b3556; background:rgba(255,255,255,.85); padding:6px 9px; border-radius:8px;
  border:2px solid #ffffff; max-width:34%; line-height:1.5; z-index:5;
}
.flight-city-from{ left:4%; }
.flight-city-to{ right:4%; text-align:right; }
.flight-card{
  padding:14px 20px 18px; background:rgba(255,255,255,.94); border-top:3px solid var(--sun);
}
.flight-airline{ font-family:'Press Start 2P',monospace; font-size:12px; color:#b76b00; margin-bottom:4px; }
.flight-route{ font-size:19px; color:var(--text); margin-bottom:10px; }
.flight-bar{ height:10px; border-radius:6px; background:#e2eef7; overflow:hidden; border:1px solid #bcd6e6; }
.flight-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--green)); transition:width .05s linear; }
.flight-meta{ margin-top:8px; font-size:14px; color:var(--text-dim); }
@media (max-width:600px){
  .flight-plane{ font-size:26px; }
  .flight-city{ font-size:8px; padding:5px 7px; }
  .flight-airline{ font-size:10px; }
  .flight-route{ font-size:15px; }
  .flight-minimap{ width:96px; height:50px; padding:5px 6px; }
  .flight-hud{ font-size:11px; padding:5px 8px; }
}

/* ---------- QUIZ ---------- */
.quiz-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
.quiz-country{ font-family:'Press Start 2P',monospace; font-size:13px; color:var(--pink); }
.quiz-progress{ display:flex; gap:6px; }
.quiz-progress i{ width:18px; height:9px; border-radius:3px; background:#d8e6f0; display:block; }
.quiz-progress i.done-correct{ background:var(--green); }
.quiz-progress i.done-wrong{ background:var(--pink); }
.quiz-progress i.current{ background:var(--sun); }
.quiz-q{ font-size:23px; margin:8px 0 16px; min-height:60px; }
.quiz-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt{ text-align:left; font-family:'VT323',monospace; font-size:18px; background:var(--panel); border:2px solid #bcd6e6;
  border-radius:10px; padding:11px 13px; cursor:pointer; color:var(--text); box-shadow:0 3px 0 rgba(0,0,0,.08); }
.opt:hover{ border-color:var(--cyan); background:#f0faff; }
.opt.correct{ border-color:var(--green); background:#dcf7e6; color:#0d6f3b; }
.opt.wrong{ border-color:var(--pink); background:#ffe1ec; color:#a8134d; }
.opt:disabled{ cursor:default; }
.feedback{ margin-top:14px; font-family:'Press Start 2P',monospace; font-size:13px; min-height:18px; text-align:center; }
.feedback.correct{ color:var(--green); }
.feedback.wrong{ color:var(--pink); }

/* ---------- RESULTS / VICTORY ---------- */
#scene-results,#scene-victory{ align-items:center; justify-content:center; text-align:center; gap:14px; }
.stamp{ font-family:'Press Start 2P',monospace; font-size:20px; color:#b76b00; background:#fff8e2;
  border:4px solid var(--sun); border-radius:12px; padding:14px 22px; transform:rotate(-3deg); animation:pop .35s ease; }
@keyframes pop{ from{ transform:scale(0.5) rotate(-3deg); opacity:0;} to{ transform:scale(1) rotate(-3deg); opacity:1;} }
.trophy-badge{ font-size:44px; animation:pop .4s ease; }
.confetti-wrap{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.confetti{ position:absolute; top:-10px; width:9px; height:15px; border-radius:2px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(560px) rotate(540deg); opacity:0.2; } }

.small-note{ font-size:16px; color:var(--text); max-width:520px; }
a.reset-link{ color:var(--text-dim); font-size:12px; }

/* ---------- TROPHY ROOM ---------- */
#scene-trophies{ padding:14px 18px; }
.trophy-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; overflow-y:auto; flex:1; padding-right:4px; }
.trophy-card{ background:var(--panel); border:2px solid #bcd6e6; border-radius:10px; padding:10px; text-align:center; }
.trophy-card.won{ border-color:var(--sun); background:#fff8e2; box-shadow:0 3px 0 rgba(224,138,0,.25); }
.trophy-card .ic{ font-size:26px; }
.trophy-card .nm{ font-size:15px; margin-top:4px; }

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}
</style>

<div class="cabinet">

(function(){
"use strict";

/* ============== SOUND ENGINE (synthesised, no audio files) ============== */
var SFX = (function(){
  var ctx = null, master = null, musicOn = true, muted = false;
  var musicTimer = null, musicStep = 0;
  var engineNodes = null;
  function ensure(){
    if(ctx) return ctx;
    try{
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    }catch(e){ ctx = null; }
    return ctx;
  }
  function tone(freq, start, dur, opts){
    if(!ctx || muted) return;
    opts = opts || {};
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = opts.type || "square";
    osc.frequency.setValueAtTime(freq, start);
    if(opts.slideTo){ osc.frequency.exponentialRampToValueAtTime(Math.max(1,opts.slideTo), start + dur); }
    var peak = opts.vol!==undefined ? opts.vol : 0.5;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.02,dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(g); g.connect(master);
    osc.start(start); osc.stop(start + dur + 0.02);
  }
  function noiseBurst(start, dur, vol){
    if(!ctx || muted) return;
    var bufSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufSize); }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol||0.3, start);
    src.connect(g); g.connect(master);
    src.start(start);
  }
  // short filtered noise click used for hats / snares in the music loop
  function noiseClick(start, dur, vol, hp){
    if(!ctx || muted) return;
    var bufSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 2); }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var f = ctx.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = hp || 3000;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol||0.08, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(start); src.stop(start + dur + 0.02);
  }
  // detuned pair for a fat 80s "supersaw" lead note
  function fatTone(freq, start, dur, vol){
    tone(freq, start, dur, {type:"square", vol:vol});
    tone(freq*1.008, start, dur, {type:"triangle", vol:vol*0.7});
  }

  /* ---- 80s/90s synth-pop arcade loop: lead + bass + drums, 16 steps ---- */
  var R = 0; // rest
  // A minor-ish pop line (A C E G ...), 32 steps of movement
  var LEAD = [
    440.00, R, 523.25, 587.33, 659.25, R, 587.33, 523.25,
    493.88, R, 587.33, 659.25, 698.46, R, 659.25, 587.33,
    523.25, R, 659.25, 783.99, 880.00, R, 783.99, 659.25,
    587.33, R, 523.25, 493.88, 440.00, R, 392.00, 440.00
  ];
  // root notes, one per beat (4 steps), classic 80s I-VI-IV-V feel
  var BASS = [
    110.00, 110.00, 164.81, 164.81,
    174.61, 174.61, 196.00, 196.00
  ];
  var STEP_MS = 150; // 16th notes at ~100bpm
  function scheduleMusic(){
    if(!ctx || !musicOn || muted) return;
    var t = ctx.currentTime + 0.02;
    var s = musicStep % 32;
    var stepDur = STEP_MS/1000;

    // lead melody
    var n = LEAD[s];
    if(n){
      var accent = (s % 4 === 0);
      fatTone(n, t, stepDur*(accent?1.7:0.85), accent ? 0.085 : 0.06);
    }
    // pad chord stab on the "and" of beats 2 and 4
    if(s % 8 === 6){
      tone(LEAD[s] || 523.25, t, stepDur*2, {type:"sawtooth", vol:0.035});
    }
    // bassline: root on each beat, plus an octave pickup before the next beat
    if(s % 4 === 0){
      tone(BASS[Math.floor(s/4) % BASS.length], t, stepDur*2.4, {type:"triangle", vol:0.14});
    }else if(s % 4 === 3){
      tone(BASS[Math.floor(s/4) % BASS.length]*2, t, stepDur*0.7, {type:"triangle", vol:0.07});
    }
    // drums: kick on 1 and 3, snare on 2 and 4, hats on off-beats
    if(s % 8 === 0 || s % 8 === 5){
      tone(70, t, 0.14, {type:"sine", vol:0.22, slideTo:38});
    }
    if(s % 8 === 4){
      noiseClick(t, 0.16, 0.10, 1400);
      tone(190, t, 0.07, {type:"triangle", vol:0.07});
    }
    if(s % 2 === 1){
      noiseClick(t, 0.045, 0.045, 6500);
    }
    musicStep++;
  }
  function startMusic(){
    if(!ensure()) return;
    if(musicTimer) return;
    musicTimer = setInterval(scheduleMusic, STEP_MS);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  }
  function click(){
    if(!ensure()) return;
    tone(880, ctx.currentTime, 0.06, {type:"square", vol:0.18, slideTo:660});
  }
  function correct(){
    if(!ensure()) return;
    var t = ctx.currentTime;
    tone(523.25, t, 0.09, {type:"square", vol:0.3});
    tone(659.25, t+0.09, 0.09, {type:"square", vol:0.3});
    tone(783.99, t+0.18, 0.16, {type:"square", vol:0.32});
  }
  function wrong(){
    if(!ensure()) return;
    var t = ctx.currentTime;
    tone(220, t, 0.16, {type:"sawtooth", vol:0.28, slideTo:110});
  }
  function trophy(){
    if(!ensure()) return;
    var t = ctx.currentTime;
    var seq = [523.25,659.25,783.99,1046.5];
    for(var i=0;i<seq.length;i++){ tone(seq[i], t+i*0.12, 0.18, {type:"square", vol:0.32}); }
  }
  function takeoff(){
    if(!ensure()) return;
    var t = ctx.currentTime;
    noiseBurst(t, 0.5, 0.15);
    tone(90, t, 1.6, {type:"sawtooth", vol:0.22, slideTo:260});
  }
  function startEngine(){
    if(!ensure()) return;
    stopEngine();
    var osc1 = ctx.createOscillator();
    var osc2 = ctx.createOscillator();
    var g = ctx.createGain();
    osc1.type = "sawtooth"; osc2.type = "square";
    osc1.frequency.value = 130; osc2.frequency.value = 133;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(muted?0.0001:0.11, ctx.currentTime+0.3);
    osc1.connect(g); osc2.connect(g); g.connect(master);
    osc1.start(); osc2.start();
    engineNodes = {osc1:osc1, osc2:osc2, g:g};
  }
  function stopEngine(){
    if(!engineNodes) return;
    var t = ctx.currentTime;
    try{
      engineNodes.g.gain.cancelScheduledValues(t);
      engineNodes.g.gain.setValueAtTime(engineNodes.g.gain.value, t);
      engineNodes.g.gain.exponentialRampToValueAtTime(0.0001, t+0.25);
      engineNodes.osc1.stop(t+0.3); engineNodes.osc2.stop(t+0.3);
    }catch(e){}
    engineNodes = null;
  }
  function toggleMute(){
    muted = !muted;
    if(master){ master.gain.value = muted ? 0 : 0.35; }
    return muted;
  }
  function unlock(){
    ensure();
    if(ctx && ctx.state === "suspended"){ ctx.resume(); }
    startMusic();
  }
  return { unlock:unlock, click:click, correct:correct, wrong:wrong, trophy:trophy, takeoff:takeoff,
           startEngine:startEngine, stopEngine:stopEngine, toggleMute:toggleMute, stopMusic:stopMusic };
})();

// region roster keeps the same shape (budget/short-hop -> premium/long-haul), so the just-built
// per-airline pricing keeps working: mult is the price multiplier vs. the base per-km rate.
var COUNTRY_REGION = {
  "United Kingdom":"europe", "Ireland":"europe", "France":"europe", "Germany":"europe",
  "Spain":"europe", "Netherlands":"europe", "Austria":"europe", "Greece":"europe",

var HOME_ID = "lhr";
var MAP_SCALE = 29; // approximate km per map-unit, tuned against a few known real distances

function pixelDist(a,b){
  var dx = a.x-b.x, dy = a.y-b.y;
  return Math.sqrt(dx*dx+dy*dy);
}
function distanceKm(a,b){
  return Math.round(pixelDist(a,b)*MAP_SCALE);
}
function routeCost(km, airline){
  var mult = airline ? airline.mult : 1;
  return Math.max(10, Math.round((km/100*mult)/5)*5);
}

function countryList(){
  var seen = {}, list = [];
  for(var i=0;i<AIRPORTS.length;i++){
    var ap = AIRPORTS[i];
    if(ap.home) continue;
    var key = ap.country.en;
    if(!seen[key]){ seen[key]=true; list.push(ap.country); }
  }
  return list;
}
var ALL_COUNTRIES = countryList();

/* ============== STATE ============== */
var state = {
  credits: 150,
  currentLocation: HOME_ID,
  visitedAirports: {},
  visitedCountries: {},
  trophies: {},
  screen: "title"
};

function saveState(){
  try{ localStorage.setItem("skygiants_save", JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    var raw = localStorage.getItem("skygiants_save");
    if(raw){ return JSON.parse(raw); }
  }catch(e){}
  return null;
}
function haveSave(){
  var s = loadState();
  return !!(s && Object.keys(s.visitedAirports||{}).length>0);
}
function saveLang(){
  try{ localStorage.setItem("skygiants_lang", lang); }catch(e){}
}
function loadLang(){
  try{ return localStorage.getItem("skygiants_lang"); }catch(e){}
  return null;
}

function airportById(id){ for(var i=0;i<AIRPORTS.length;i++){ if(AIRPORTS[i].id===id) return AIRPORTS[i]; } return null; }
function currentAirport(){ return airportById(state.currentLocation); }

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

// Picks 5 random questions in the current language, and shuffles the options.
function randomQuiz(ap){
  var pool = shuffle(ap.quiz);
  var picked = pool.slice(0,5);
  return picked.map(function(q){
    var loc = q[lang] || q.it;
    var options = loc[1].map(function(text,i){ return {text:text, orig:i}; });
    options = shuffle(options);
    var newCorrect = 0;
    for(var i=0;i<options.length;i++){ if(options[i].orig===q.c){ newCorrect=i; break; } }
    return [loc[0], options.map(function(o){return o.text;}), newCorrect];
  });
}

/* ============== SCENE SWITCH ============== */
function showScene(id){
  var scenes = document.querySelectorAll(".scene");
  for(var i=0;i<scenes.length;i++){ scenes[i].classList.remove("active"); }
  document.getElementById(id).classList.add("active");
  state.screen = id;
}

/* ============== STARFIELD ============== */
function buildStars(){
  var wrap = document.getElementById("stars");
  var html = "";
  for(var i=0;i<28;i++){
    var x = Math.random()*100, y = Math.random()*100, d = (1.6+Math.random()*2.4).toFixed(2), delay=(Math.random()*2).toFixed(2);
    html += '<span class="star" style="left:'+x+'%; top:'+y+'%; animation-duration:'+d+'s; animation-delay:'+delay+'s;"></span>';
  }
  wrap.innerHTML = html;
}

/* ---- zoom/pan viewbox state ---- */
var view = { x:0, y:0, w:1000, h:500 };
var MIN_W = 90, MAX_W = 1000;

function applyView(){
  var svg = document.getElementById("map-svg");
  svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+view.h);
}
function zoomBy(factor, cx, cy){
  if(cx===undefined){ cx = view.x + view.w/2; cy = view.y + view.h/2; }
  var newW = Math.min(MAX_W, Math.max(MIN_W, view.w*factor));
  var newH = newW * 0.5;
  var fx = (cx - view.x)/view.w, fy = (cy - view.y)/view.h;
  view.x = cx - fx*newW;
  view.y = cy - fy*newH;
  view.w = newW; view.h = newH;
  clampView();
  applyView();
}
function clampView(){
  view.x = Math.max(-40, Math.min(1040 - view.w, view.x));
  view.y = Math.max(-40, Math.min(540 - view.h, view.y));
}
function resetView(){ view = { x:0, y:0, w:1000, h:500 }; applyView(); }

function autoFitView(airports){
  if(!airports || !airports.length){ return; }
  var minX=1000, maxX=0, minY=500, maxY=0;
  for(var i=0;i<airports.length;i++){
    var a = airports[i];
    if(a.x<minX) minX=a.x;
    if(a.x>maxX) maxX=a.x;
    if(a.y<minY) minY=a.y;
    if(a.y>maxY) maxY=a.y;
  }
  var padX = 60, padY = 50;
  minX -= padX; maxX += padX; minY -= padY; maxY += padY;
  var boxW = maxX - minX, boxH = maxY - minY;
  var boxCx = (minX+maxX)/2, boxCy = (minY+maxY)/2;
  var w = Math.max(boxW, boxH*2);
  w = Math.min(MAX_W, Math.max(MIN_W, w));
  var h = w * 0.5;
  view.w = w; view.h = h;
  view.x = boxCx - w/2;
  view.y = boxCy - h/2;
  clampView();

    var color = visited ? "#159a52" : "#0e7fb8";
    parts.push('<line x1="'+here.x+'" y1="'+here.y+'" x2="'+ap.x+'" y2="'+ap.y+'" stroke="'+color+'" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.5"></line>');
  }
  for(var j=0;j<others.length;j++){
    var a = others[j];
    var vis = !!state.visitedCountries[countryKey(a)];
    var col = vis ? "#159a52" : "#0e7fb8";
    parts.push('<g class="airport-dot" data-id="'+a.id+'" tabindex="0" role="button" aria-label="'+nameOf(a)+'">'+
      '<title>'+nameOf(a)+'</title>'+
      '<circle class="hit" cx="'+a.x+'" cy="'+a.y+'" r="14" fill="transparent"></circle>'+
      '<circle class="core" cx="'+a.x+'" cy="'+a.y+'" r="6" fill="'+col+'" stroke="#ffffff" stroke-width="1.6"></circle>'+
      '<text class="airport-label" x="'+a.x+'" y="'+(a.y-11)+'" text-anchor="middle" fill="#16324e" stroke="#ffffff" stroke-width="2.2" paint-order="stroke">'+nameOf(a)+'</text>'+
      '</g>');
  }
  // current location marker on top, sunny yellow
  parts.push('<g id="here-marker"><circle cx="'+here.x+'" cy="'+here.y+'" r="7" fill="#ffd23f" stroke="#b76b00" stroke-width="1.6"></circle>'+
    '<text x="'+here.x+'" y="'+(here.y-13)+'" text-anchor="middle" fill="#b76b00" stroke="#ffffff" stroke-width="2.6" paint-order="stroke" font-size="12" font-weight="bold">'+nameOf(here)+'</text></g>');

  svg.innerHTML = parts.join("");
  autoFitView(others.concat([here]));
  // size dots/labels to a constant on-screen size and declutter now that autoFitView may have changed the zoom level
  applyMarkerScale();

  svg.querySelectorAll(".airport-dot").forEach(function(dot){
    dot.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ onAirportClick(this.getAttribute("data-id")); } });
  });

  document.getElementById("map-msg").textContent = t("tapAirport");

  if(!mapWired){ mapWired = true; wireMapInteraction(); }
  updateHud();
}

// Keeps airport dots and their name labels a constant, readable size in screen pixels no
// matter how far zoomed in the SVG viewBox is (plain viewBox scaling would otherwise make
// dots balloon and text grow huge/overlapping the closer you zoom). Also hides a label only
// when its dot is genuinely within a fixed on-screen gap of one already shown.
function applyMarkerScale(){
  var svg = document.getElementById("map-svg");
  if(!svg) return;
  var rectNow = svg.getBoundingClientRect();
  var scalePx = (rectNow.width || 900) / view.w;
  var dotR = 6/scalePx, hitR = 16/scalePx, dotStroke = 1.6/scalePx;
  var labelGap = 9/scalePx, labelFont = 12/scalePx, labelStroke = 2.2/scalePx;
  var minGapPx = 44; // constant on-screen gap between shown labels
  var minGapUnits = minGapPx/scalePx;
  var here = currentAirport();
  var placed = [{x:here.x, y:here.y}];
  svg.querySelectorAll(".airport-dot").forEach(function(dot){
    var core = dot.querySelector("circle.core");
    var hit = dot.querySelector("circle.hit");
    var label = dot.querySelector(".airport-label");
    var cx = parseFloat(core.getAttribute("cx"));
    var cy = parseFloat(core.getAttribute("cy"));
    core.setAttribute("r", dotR);
    core.setAttribute("stroke-width", dotStroke);
    if(hit){ hit.setAttribute("r", hitR); }
    var tooClose = false;
    for(var k=0;k<placed.length;k++){
      var dx = cx - placed[k].x, dy = cy - placed[k].y;
      if(Math.sqrt(dx*dx+dy*dy) < minGapUnits){ tooClose = true; break; }
    }
    if(label){
      label.setAttribute("y", cy - dotR - labelGap);
      label.setAttribute("font-size", labelFont);
      label.setAttribute("stroke-width", labelStroke);
      label.style.display = tooClose ? "none" : "";
    }
    if(!tooClose){ placed.push({x:cx, y:cy}); }
  });
  var hereWrap = document.getElementById("here-marker");
  if(hereWrap){
    var hereCore = hereWrap.querySelector("circle");
    var hereText = hereWrap.querySelector("text");
    var hereR = 7/scalePx, hereStroke = 1.6/scalePx;
    if(hereCore){ hereCore.setAttribute("r", hereR); hereCore.setAttribute("stroke-width", hereStroke); }
    if(hereText){
      hereText.setAttribute("font-size", 13/scalePx);
      hereText.setAttribute("stroke-width", 2.6/scalePx);
      hereText.setAttribute("y", here.y - hereR - 11/scalePx);
    }
  }
}

function wireMapInteraction(){
  var svg = document.getElementById("map-svg");
  var dragging = false, lastX=0, lastY=0, startX=0, startY=0, moved=0, downId=null;
  svg.addEventListener("wheel", function(e){
    e.preventDefault();
    var rect = svg.getBoundingClientRect();
    var px = view.x + (e.clientX-rect.left)/rect.width*view.w;
    var py = view.y + (e.clientY-rect.top)/rect.height*view.h;
    zoomBy(e.deltaY < 0 ? 0.82 : 1.22, px, py);
    applyMarkerScale();
  }, { passive:false });
  svg.addEventListener("pointerdown", function(e){
    dragging = true; lastX=e.clientX; lastY=e.clientY; startX=e.clientX; startY=e.clientY; moved=0;
    downId = (e.target.closest ? e.target.closest(".airport-dot") : null);
    svg.classList.add("grabbing");
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var rect = svg.getBoundingClientRect();
    var dx = (e.clientX-lastX)/rect.width*view.w;
    var dy = (e.clientY-lastY)/rect.height*view.h;
    moved += Math.abs(e.clientX-startX) + Math.abs(e.clientY-startY);
    // only pan once the pointer has actually moved a few pixels — keeps a plain tap from panning
    if(Math.abs(e.clientX-startX) > 4 || Math.abs(e.clientY-startY) > 4){
      view.x -= dx; view.y -= dy;
      clampView();
      applyView();
    }
    lastX = e.clientX; lastY = e.clientY;
  });
  ["pointerup","pointerleave","pointercancel"].forEach(function(evt){
    svg.addEventListener(evt, function(e){
      var wasDrag = moved > 6;
      dragging=false; svg.classList.remove("grabbing");
      if(evt === "pointerup" && !wasDrag){
        var dot = downId || (e.target.closest ? e.target.closest(".airport-dot") : null);
        if(dot){ onAirportClick(dot.getAttribute("data-id")); }
      }
      downId = null;
    });
  });
  document.getElementById("btn-zoom-in").addEventListener("click", function(){ zoomBy(0.7); applyMarkerScale(); });
  document.getElementById("btn-zoom-out").addEventListener("click", function(){ zoomBy(1.4); applyMarkerScale(); });
  document.getElementById("btn-zoom-reset").addEventListener("click", function(){ resetView(); applyMarkerScale(); });
}

function updateHud(){

var flying = false;
function onAirportClick(id){
  if(flying) return;
  var ap = airportById(id);
  var msg = document.getElementById("map-msg");
  if(!ap || ap.id === state.currentLocation){ msg.innerHTML = t("alreadyHere"); return; }
  var here = currentAirport();

}

/* ============== BOOKING CONFIRMATION ============== */
var booking = null; // { from, to, km, airlineIdx, choices }
function bookingCost(){
  if(!booking) return 0;
  return routeCost(booking.km, booking.choices[booking.airlineIdx]);
}
function openBooking(here, ap, km){
  // every airline whose range covers this route is a valid choice — a bigger plane can always
  // fly a shorter hop too, it's just not the cheapest/most efficient pick for it. Sort cheapest first
  // so the budget option is the default pick.
  var roster = airlinesForRoute(ap);
  var choices = roster.filter(function(al){ return km <= al.max; });
  if(choices.length === 0){ choices = [roster[roster.length-1]]; }
  choices = choices.slice().sort(function(a,b){ return routeCost(km,a) - routeCost(km,b); });
  booking = { from: here, to: ap, km: km, airlineIdx: 0, choices: choices };
  renderBooking();
  document.getElementById("booking-overlay").classList.add("show");
}
function closeBooking(){
  booking = null;
  document.getElementById("booking-overlay").classList.remove("show");
}
function renderBooking(){
  if(!booking) return;
  var cost = bookingCost();
  document.getElementById("booking-dest").innerHTML = nameOf(booking.to);
  document.getElementById("booking-sub").innerHTML = countryOf(booking.to)+" &middot; "+booking.km+" km";
  document.getElementById("booking-cost-value").textContent = cost+" CR";
  var warn = document.getElementById("booking-warn");
  var canAfford = state.credits >= cost;
  warn.textContent = canAfford ? "" : t("bookNoCredits")(cost, state.credits);
  document.getElementById("booking-confirm").classList.toggle("disabled", !canAfford);

  var wrap = document.getElementById("booking-planes");
  var html = "";
  for(var i=0;i<booking.choices.length;i++){
    var al = booking.choices[i];
    var sel = i === booking.airlineIdx ? " sel" : "";
    var alCost = routeCost(booking.km, al);
    html += '<div class="plane-opt'+sel+'" data-i="'+i+'">'+
      '<span class="pe">'+al.emoji+'</span>'+
      '<span class="pn">'+al.name+'</span>'+
      '<span class="pt">'+al.plane+'</span>'+
      '<span class="pc">'+alCost+' CR</span>'+
      '</div>';
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll(".plane-opt").forEach(function(el){
    el.addEventListener("click", function(){
      booking.airlineIdx = parseInt(this.getAttribute("data-i"),10);
      SFX.click();
      renderBooking();
    });
  });
}
function confirmBooking(){
  if(!booking) return;
  var cost = bookingCost();
  if(state.credits < cost){ SFX.wrong(); return; }
  var b = booking;
  var airline = b.choices[b.airlineIdx];
  state.credits -= cost;
  saveState();
  closeBooking();
  animateFlight(b.from, b.to, b.km, cost, airline);
}
function wireBooking(){
  document.getElementById("booking-close").addEventListener("click", closeBooking);
  document.getElementById("booking-cancel").addEventListener("click", closeBooking);
  document.getElementById("booking-confirm").addEventListener("click", confirmBooking);
  document.getElementById("booking-overlay").addEventListener("click", function(e){
    if(e.target === this){ closeBooking(); }
  });
}

/* ============== FLIGHT ANIMATION (dedicated full-screen scene) ============== */

function animateFlight(from, to, km, cost, airline){
  flying = true;
  showScene("scene-flight");
  SFX.takeoff();
  SFX.startEngine();

  document.getElementById("flight-plane").textContent = "✈️";

  document.getElementById("flight-airline").textContent = airline.emoji+" "+airline.name+" · "+airline.plane;
  document.getElementById("flight-route").innerHTML = nameOf(from)+" &rarr; "+nameOf(to);
  document.getElementById("flight-meta").textContent = km+" km · "+cost+" CR";
  document.getElementById("flight-city-from").textContent = nameOf(from);
  document.getElementById("flight-city-to").textContent = nameOf(to);
  document.getElementById("flight-bar-fill").style.width = "0%";

  var planeEl = document.getElementById("flight-plane");
  var shadowEl = document.getElementById("flight-shadow");
  var skyOuterEl = document.getElementById("flight-sky");
  var skyEl = document.querySelector(".flight-sky");
  var groundEl = document.querySelector(".flight-ground");
  var arc = document.getElementById("flight-arc");
  var arcLen = arc.getTotalLength();
  var engineCount = 1;

  // long-haul routes get a dusk/night sky with stars and a moon; short hops stay daytime
  var isNight = km > 3000;
  skyOuterEl.classList.toggle("night", isNight);
  var starsEl = document.getElementById("flight-stars");
  if(isNight && !starsEl.dataset.built){
    var starHtml = "";
    for(var si=0; si<26; si++){
      var sx = (si*37 % 100), sy = (si*53 % 60);
      var big = (si % 4 === 0);
      starHtml += '<div class="flight-star'+(big?' big':'')+'" style="left:'+sx+'%;top:'+sy+'%;"></div>';
    }
    starsEl.innerHTML = starHtml;
    starsEl.dataset.built = "1";
  }

  // live route HUD + mini-map marker
  var hudKmEl = document.getElementById("flight-hud-km");
  var hudAltEl = document.getElementById("flight-hud-alt");
  var hudSpdEl = document.getElementById("flight-hud-spd");
  var miniHereEl = document.getElementById("flight-minidot-here");
  var miniFromEl = document.getElementById("flight-minidot-from");
  var miniToEl = document.getElementById("flight-minidot-to");
  var miniRouteEl = document.getElementById("flight-miniroute");
  var MINI_X0 = 8, MINI_X1 = 110, MINI_Y = 38, MINI_Y_TOP = 26;
  miniFromEl.style.left = MINI_X0+"px"; miniFromEl.style.top = MINI_Y+"px";
  miniToEl.style.left = MINI_X1+"px"; miniToEl.style.top = MINI_Y+"px";
  miniRouteEl.style.left = (MINI_X0+6)+"px"; miniRouteEl.style.top = (MINI_Y-2)+"px"; miniRouteEl.style.width = (MINI_X1-MINI_X0-4)+"px";
  // the scene is a fixed "camera": departure city is always the left label, arrival is always the
  // right label, so the plane always flies left-to-right on screen regardless of real-world heading
  var EMOJI_ROT = 45; // the plane emoji's glyph points up-right by default; rotate it to face along the path
  planeEl.style.transform = "translate(-50%,-50%) rotate("+EMOJI_ROT+"deg)";
  // clear any contrail puffs left over from a previous flight
  skyEl.querySelectorAll(".flight-contrail").forEach(function(el){ el.remove(); });

  var duration = 3800;
  var t0 = null;
  var lastPuff = 0;
  var bounced = false;
  function step(ts){
    if(t0===null) t0 = ts;
    var p = Math.min(1, (ts-t0)/duration);
    var ease = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    var alongLen = ease*arcLen;
    var pt = arc.getPointAtLength(alongLen);
    var pt2 = arc.getPointAtLength(Math.min(arcLen, Math.max(0, alongLen + 0.6)));
    var tangentAngle = Math.atan2(pt2.y-pt.y, pt2.x-pt.x) * 180/Math.PI;
    // pitch the nose up on takeoff and down on landing, on top of the path's own tangent
    var pitch = 0;
    if(p < 0.12){ pitch = -22 * (1 - p/0.12); }
    else if(p > 0.88){ pitch = 20 * ((p-0.88)/0.12); }
    var angle = tangentAngle + pitch;
    // altitude illusion: the plane shrinks as it climbs to cruise height, then grows again on approach
    var altitude = Math.sin(Math.min(1,p) * Math.PI); // 0 at both ends, 1 at the midpoint
    var scale = 1.12 - altitude*0.42;
    // gentle roll: bank slightly harder while climbing or descending fastest (mid-takeoff/landing)
    var bank = 0;
    if(p < 0.22) bank = -6 * Math.sin(Math.min(1,p/0.22)*Math.PI);
    else if(p > 0.78) bank = 6 * Math.sin(Math.min(1,(p-0.78)/0.22)*Math.PI);
    var leftPct = pt.x, topPct = (pt.y/30*100);
    planeEl.style.left = leftPct+"%";
    planeEl.style.top = topPct+"%";
    var squash = 1;
    if(p > 0.965 && !bounced){ bounced = true; squash = 0.82; setTimeout(function(){ bounced = "settled"; }, 130); }
    var scaleY = bounced === true ? squash : 1;
    var faceAngle = (angle+bank) + EMOJI_ROT;
    planeEl.style.transform = "translate(-50%,-50%) rotate("+faceAngle+"deg) scale("+scale.toFixed(3)+","+(scale*scaleY).toFixed(3)+")";
    planeEl.style.filter = "drop-shadow(0 "+(4+altitude*10)+"px "+(8+altitude*10)+"px rgba(10,40,70,"+(0.35-altitude*0.15)+"))";
    // groundshadow drifts toward the flight path and fades thin at cruise altitude
    shadowEl.style.left = leftPct+"%";
    shadowEl.style.top = Math.min(97, topPct + 8 + altitude*4)+"%";
    shadowEl.style.opacity = (0.5 - altitude*0.38).toFixed(2);
    shadowEl.style.width = (26 - altitude*12)+"px";
    // runway stripes scroll under the plane during taxi/takeoff-roll and landing-rollout for a sense of ground speed
    if(groundEl){
      var taxiSpeed = 0;
      if(p < 0.09) taxiSpeed = (p/0.09);
      else if(p > 0.94) taxiSpeed = ((1-p)/0.06);
      var scrollPx = -1 * (ts%4000)/4000 * 160 * (0.3+taxiSpeed);
      groundEl.style.setProperty("--scroll", scrollPx+"px");
    }
    // lay down a fading contrail/exhaust puff every ~55ms while at meaningful altitude, one per engine
    if(altitude > 0.15 && ts - lastPuff > 55){
      lastPuff = ts;
      var puffOffsets = engineCount === 1 ? [0] : [-3.5, 3.5];
      puffOffsets.forEach(function(off){
        var puff = document.createElement("div");
        puff.className = "flight-contrail";
        puff.style.left = (leftPct - off*0.35)+"%";
        puff.style.top = (topPct + 1.2)+"%";
        skyEl.appendChild(puff);
        setTimeout(function(){ puff.remove(); }, 950);
      });
    }
    document.getElementById("flight-bar-fill").style.width = (p*100)+"%";
    // move the mini-map marker along a shallow arc and update the live km/altitude/speed readout
    var miniX = MINI_X0 + p*(MINI_X1-MINI_X0);
    var miniY = MINI_Y - Math.sin(p*Math.PI) * (MINI_Y - MINI_Y_TOP);
    miniHereEl.style.left = miniX+"px";
    miniHereEl.style.top = miniY+"px";
    hudKmEl.textContent = Math.max(0, Math.round(km*(1-p)));
    hudAltEl.textContent = Math.round(altitude*11000/100)*100;
    hudSpdEl.textContent = Math.round(240 + altitude*580);
    if(p < 1){
      requestAnimationFrame(step);
    }else{
      state.currentLocation = to.id;
      saveState();
      flying = false;
      SFX.stopEngine();
      setTimeout(function(){ startQuiz(to); }, 350);
    }
  }
  requestAnimationFrame(step);
}

/* ============== QUIZ ============== */
var quizState = null;
function startQuiz(ap){
  showScene("scene-quiz");
  var questions = randomQuiz(ap);
  quizState = { ap: ap, idx: 0, correct: 0, results: [], locked:false, questions: questions };
  renderQuizHeader();
  renderQuizProgress();
  renderQuestion();
}
function renderQuizHeader(){
  document.getElementById("quiz-country").innerHTML = nameOf(quizState.ap).toUpperCase()+" &middot; "+countryOf(quizState.ap).toUpperCase();
}
function renderQuizProgress(){
  var wrap = document.getElementById("quiz-progress");
  var html = "";
  for(var i=0;i<quizState.questions.length;i++){
    var cls = "";
    if(i < quizState.results.length){ cls = quizState.results[i] ? "done-correct" : "done-wrong"; }
    else if(i === quizState.idx){ cls = "current"; }
    html += '<i class="'+cls+'"></i>';
  }
  wrap.innerHTML = html;
}
function renderQuestion(){
  quizState.locked = false;
  var q = quizState.questions[quizState.idx];
  document.getElementById("quiz-q").innerHTML = q[0];
  document.getElementById("quiz-feedback").textContent = "";
  document.getElementById("quiz-feedback").className = "feedback";
  var opts = document.getElementById("quiz-options");
  var html = "";
  for(var i=0;i<q[1].length;i++){
    html += '<button class="opt" data-i="'+i+'">'+q[1][i]+'</button>';
  }
  opts.innerHTML = html;
  var btns = opts.querySelectorAll(".opt");
  btns.forEach(function(b){
    b.addEventListener("click", function(){ answerQuestion(parseInt(this.getAttribute("data-i"),10)); });
  });
}
function answerQuestion(choice){
  if(quizState.locked) return;
  quizState.locked = true;
  var q = quizState.questions[quizState.idx];
  var correctIdx = q[2];
  var isCorrect = choice === correctIdx;
  var opts = document.getElementById("quiz-options").querySelectorAll(".opt");
  opts.forEach(function(b){
    b.disabled = true;
    var i = parseInt(b.getAttribute("data-i"),10);
    if(i === correctIdx) b.classList.add("correct");
    else if(i === choice) b.classList.add("wrong");
  });
  var fb = document.getElementById("quiz-feedback");
  if(isCorrect){ fb.textContent = t("right"); fb.className = "feedback correct"; quizState.correct++; SFX.correct(); }
  else{ fb.textContent = t("wrong"); fb.className = "feedback wrong"; SFX.wrong(); }
  quizState.results.push(isCorrect);
  renderQuizProgress();
  setTimeout(function(){
    quizState.idx++;
    if(quizState.idx < quizState.questions.length){ renderQuestion(); }
    else{ finishQuiz(); }
  }, 1300);
}
var lastResult = null;
function finishQuiz(){
  var total = quizState.questions.length;
  var earned = quizState.correct * 30 + (quizState.correct===total ? 50 : 0);
  state.credits += earned;
  state.visitedAirports[quizState.ap.id] = true;
  var key = countryKey(quizState.ap);
  var isNewCountry = !state.visitedCountries[key];
  state.visitedCountries[key] = true;
  var perfect = quizState.correct === total;
  var wonTrophy = false;
  if(perfect && !state.trophies[key]){
    state.trophies[key] = quizState.ap.id;
    wonTrophy = true;
    SFX.trophy();
  }
  saveState();
  lastResult = { ap:quizState.ap, correct:quizState.correct, total:total, earned:earned, perfect:perfect, wonTrophy:wonTrophy, isNew:isNewCountry };
  showScene("scene-results");
  renderResults();
  drawMap();
  if(Object.keys(state.visitedCountries).length >= ALL_COUNTRIES.length){
    setTimeout(showVictory, 1400);
  }
}
function renderResults(){
  if(!lastResult) return;
  var r = lastResult;
  document.getElementById("results-stamp").innerHTML = t("correctOf")(r.correct, r.total);
  var trophyBox = document.getElementById("results-trophy");
  trophyBox.innerHTML = r.wonTrophy ? '<div class="trophy-badge">&#127942;</div><div class="small-note" style="color:#b76b00">'+t("trophyWon")(countryOf(r.ap))+'</div>' : "";
  var bonusMsg = r.perfect ? t("perfectBonus") : "";
  var newMsg = r.isNew ? t("newCountry") : "";
  document.getElementById("results-detail").innerHTML =
    t("landedAt")+": <b style='color:#0d6f3b'>"+nameOf(r.ap)+", "+countryOf(r.ap)+"</b><br>"+
    t("youEarned")+" <b style='color:#b76b00'>"+r.earned+" "+t("creditsWord")+"</b>."+bonusMsg+newMsg;
}

/* ============== VICTORY ============== */
function showVictory(){
  showScene("scene-victory");
  renderVictory();
  var wrap = document.getElementById("confetti-wrap");
  var colors = ["#0e7fb8","#e0417c","#ffd23f","#159a52","#ff8a3d"];
  var html = "";
  for(var i=0;i<50;i++){
    var left = Math.random()*100;
    var dur = (1.6+Math.random()*1.6).toFixed(2);
    var delay = (Math.random()*1.4).toFixed(2);
    var color = colors[i%colors.length];
    html += '<div class="confetti" style="left:'+left+'%; background:'+color+'; animation-duration:'+dur+'s; animation-delay:'+delay+'s;"></div>';
  }
  wrap.innerHTML = html;
}
function renderVictory(){
  document.getElementById("victory-stamp").innerHTML = t("victoryStamp");
  document.getElementById("victory-detail").innerHTML = t("victoryDetail")(state.credits, Object.keys(state.trophies).length);
}

/* ============== LANGUAGE APPLY / SWITCH ============== */
function applyLang(){
  document.getElementById("cabinet-player").innerHTML = t("player");
  document.getElementById("logo-sub").innerHTML = t("logoSub");
  document.getElementById("title-foot").innerHTML = t("titleFoot");
  document.getElementById("btn-start").innerHTML = t("start")+'<span class="blink">_</span>';
  document.getElementById("btn-lang-title").innerHTML = t("langBtnTitle");
  document.getElementById("lbl-countries").innerHTML = t("countries");
  document.getElementById("lbl-trophies").innerHTML = t("trophies");
  document.getElementById("lbl-lang").innerHTML = t("langChip");
  document.getElementById("trophy-room-title").innerHTML = t("trophyRoom");
  document.getElementById("btn-map-from-trophies").innerHTML = t("backToMap");
  document.getElementById("btn-back-to-map").innerHTML = t("backToMapBig");
  document.getElementById("btn-play-again").innerHTML = t("playAgain");
  document.getElementById("map-hint").innerHTML = t("mapHint");
  document.getElementById("lg-here").innerHTML = t("legendHere");
  document.getElementById("lg-visited").innerHTML = t("legendVisited");
  document.getElementById("lg-todo").innerHTML = t("legendTodo");
  document.getElementById("booking-plane-label").innerHTML = t("bookChoosePlane");
  document.getElementById("booking-cost-label").innerHTML = t("bookCostLabel");
  document.getElementById("booking-confirm").innerHTML = t("bookConfirm");
  document.getElementById("booking-cancel").innerHTML = t("bookCancel");
  document.getElementById("flight-minimap-title").textContent = t("hudRoute");
  document.getElementById("flight-hud-km-lbl").textContent = t("hudKmLeft");
  document.getElementById("flight-hud-alt-lbl").textContent = t("hudAlt");
  document.getElementById("flight-hud-spd-lbl").textContent = t("hudSpd");
  renderContinueNote();
}
function renderContinueNote(){
  var note = document.getElementById("continue-note");
  if(!haveSave()){ note.style.display = "none"; return; }
  note.style.display = "block";
  note.innerHTML = t("saveFound")+' <a href="#" id="btn-continue" style="color:#0d6f3b;">'+t("continueLbl")+
    '</a> &middot; <a href="#" id="btn-newgame" style="color:#e0417c;">'+t("newGameLbl")+'</a>';
  document.getElementById("btn-continue").addEventListener("click", onContinue);
  document.getElementById("btn-newgame").addEventListener("click", onNewGame);
}
// re-render whatever screen is showing, without losing any progress
function refreshCurrentScreen(){
  applyLang();
  var id = state.screen;
  if(id === "scene-map"){ drawMap(); }
  else if(id === "scene-trophies"){ drawTrophies(); }
  else if(id === "scene-quiz" && quizState){
    // keep the same questions, but show them in the new language
    var fresh = randomQuiz(quizState.ap);
    quizState.questions = fresh;
    quizState.idx = 0; quizState.correct = 0; quizState.results = []; quizState.locked = false;
    renderQuizHeader(); renderQuizProgress(); renderQuestion();
  }
  else if(id === "scene-results"){ renderResults(); }
  else if(id === "scene-victory"){ renderVictory(); }
  updateHud();
}
function setLang(l, refresh){
  lang = (l === "en") ? "en" : "it";
  saveLang();
  if(refresh){ refreshCurrentScreen(); } else { applyLang(); }
}
// Sound is best-effort. If audio ever throws (blocked API, odd sandbox, etc.)
// it must never stop the actual button action from happening.
function safeSfx(fn){
  try{ fn(); }catch(e){}
}
function toggleLang(){
  safeSfx(function(){ SFX.click(); });
  setLang(lang === "it" ? "en" : "it", true);
}

/* ============== NAV WIRES ============== */
function goToMap(){ showScene("scene-map"); drawMap(); }
function freshState(){
  return { credits:150, currentLocation:HOME_ID, visitedAirports:{}, visitedCountries:{}, trophies:{}, screen:"title" };
}
function onContinue(e){
  if(e) e.preventDefault();
  safeSfx(function(){ SFX.unlock(); SFX.click(); });
  var s = loadState();
  if(s){ state = s; }
  goToMap();
}
function onNewGame(e){
  if(e) e.preventDefault();
  safeSfx(function(){ SFX.unlock(); SFX.click(); });
  state = freshState();
  saveState();
  goToMap();
}

// wire(id, handler) — handler runs first (the actual button action), sound is
// attempted afterward and can never block or skip the action.
function wire(id, handler){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener("click", function(e){
    try{ handler(e); }catch(err){}
  });
}

wire("btn-lang-en", function(){
  setLang("en", false);
  showScene("scene-title");
  safeSfx(function(){ SFX.unlock(); SFX.click(); });
});
wire("btn-lang-it", function(){
  setLang("it", false);
  showScene("scene-title");
  safeSfx(function(){ SFX.unlock(); SFX.click(); });
});
wire("btn-lang-title", toggleLang);
wire("btn-lang-map", toggleLang);
wire("btn-lang-trophies", toggleLang);

wire("btn-start", function(){
  goToMap();
  safeSfx(function(){ SFX.unlock(); SFX.click(); });
});
wire("btn-trophies", function(){ showScene("scene-trophies"); drawTrophies(); safeSfx(function(){ SFX.click(); }); });
wire("btn-map-from-trophies", function(){ goToMap(); safeSfx(function(){ SFX.click(); }); });
wire("btn-back-to-map", function(){ goToMap(); document.getElementById("map-msg").textContent=""; safeSfx(function(){ SFX.click(); }); });
wire("btn-play-again", function(){
  state = freshState();
  saveState();
  goToMap();
  safeSfx(function(){ SFX.click(); });
});
wire("btn-sound", function(){
  var muted = false;
  safeSfx(function(){ SFX.unlock(); muted = SFX.toggleMute(); });
  document.getElementById("btn-sound").innerHTML = (muted ? "&#128263; " : "&#128266; ") + '<span id="sound-label">'+(muted?"OFF":"ON")+'</span>';
});
document.body.addEventListener("click", function(){ safeSfx(function(){ SFX.unlock(); }); }, {once:true});

/* ============== INIT ============== */
buildStars();
wireBooking();
var savedLang = loadLang();
lang = (savedLang === "en" || savedLang === "it") ? savedLang : "it";
applyLang();
// The language picker is the very first screen every time the game loads.
showScene("scene-lang");
state.screen = "scene-lang";
})();
</script>
